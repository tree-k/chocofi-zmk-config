# ZMK sleep settings
CONFIG_ZMK_SLEEP=y
# Timeout in millisec  -- 5 mins idle state and 15 mins deep sleep
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# max bt connections: 5 host profiles + 1 split peripheral
# (on the central, host profiles = BT_MAX_PAIRED - 1)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# PC + Mac combo variants share keys
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8

# enable soft-off behavior
CONFIG_ZMK_PM_SOFT_OFF=y

# enable mouse
CONFIG_ZMK_MOUSE=y